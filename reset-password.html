
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | SAS Basketball</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #101116, #391219);
      color: #20232b;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 34px;
      border-radius: 22px;
      background: white;
    }
    .eyebrow {
      color: #cf2029;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    h1 { margin: 12px 0; font-size: 30px; }
    p { color: #656b77; line-height: 1.6; }
    label { display: block; margin: 18px 0 7px; font-weight: 700; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cfd3da;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      background: #d51f28;
      border: 0;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    a { color: #c91e27; }
    #message { margin-top: 18px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">SAS PUXI EAGLES</div>
    <h1>Basketball Account Recovery</h1>
    <p>Reset your coaching account password.</p>

    <form id="requestForm">
      <label for="email">Account email</label>
      <input id="email" type="email" autocomplete="email" required>
      <button type="submit">Send Reset Link</button>
    </form>

    <form id="changeForm" hidden>
      <label for="password">New password</label>
      <input id="password" type="password"
             autocomplete="new-password" minlength="12" required>

      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password"
             autocomplete="new-password" minlength="12" required>

      <button type="submit">Save New Password</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="./">Return to Basketball App</a></p>
  </main>

  <script src="config.js"></script>
  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const config = window.SAS_CONFIG;
    const message = document.getElementById("message");
    const requestForm = document.getElementById("requestForm");
    const changeForm = document.getElementById("changeForm");

    if (!config?.supabaseUrl || !config?.supabasePublishableKey) {
      message.textContent = "Application configuration is missing.";
      throw new Error("Missing Supabase configuration");
    }

    const supabase = createClient(
      config.supabaseUrl,
      config.supabasePublishableKey
    );

    function showChangeForm() {
      requestForm.hidden = true;
      changeForm.hidden = false;
      message.textContent = "Enter your new password.";
    }

    const fromRecoveryLink =
      location.hash.includes("access_token=") ||
      new URLSearchParams(location.search).has("code");

    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        showChangeForm();
      }
    });

    const { data: sessionData } = await supabase.auth.getSession();
    if (fromRecoveryLink && sessionData.session) {
      showChangeForm();
    }

    requestForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = requestForm.querySelector("button");
      button.disabled = true;
      message.textContent = "Sending recovery request...";

      const email = document.getElementById("email").value.trim();
      const { error } = await supabase.auth.resetPasswordForEmail(
        email,
        { redirectTo: location.origin + location.pathname }
      );

      message.textContent = error
        ? error.message
        : "If the account exists, a recovery email will be sent. Check your inbox.";

      button.disabled = false;
    });

    changeForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        message.textContent = "Passwords do not match.";
        return;
      }

      const button = changeForm.querySelector("button");
      button.disabled = true;
      message.textContent = "Updating password...";

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        message.textContent = error.message;
        button.disabled = false;
        return;
      }

      await supabase.auth.signOut();
      history.replaceState({}, "", location.pathname);
      changeForm.hidden = true;
      message.textContent =
        "Password updated. Return to the Basketball App and sign in.";
    });
  </script>
</body>
</html>
